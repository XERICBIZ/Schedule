<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>III Semester • Section A</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Kalam:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script
        crossorigin
        src="https://unpkg.com/react@18/umd/react.development.js">
    </script>

    <script
        crossorigin
        src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>

        :root {
            --paper: #fffaf0;
            --paper2: #f7efe1;
            --white: #fffdf8;

            --ink: #171717;
            --muted: #6d675f;

            --orange: #f49b45;
            --blue: #4c89a8;
            --red: #c85b4f;
            --teal: #3f8f89;
            --purple: #8069a8;

            --yellow: #f8c95c;

            --line: rgba(25,25,25,.09);

            --shadow:
                0 25px 60px rgba(70,50,30,.14);
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-width: 320px;

            font-family:
                "Space Grotesk",
                sans-serif;

            background: #e8e0d3;
            color: var(--ink);
        }


        button {
            font-family: inherit;
        }


        .app {
            min-height: 100vh;

            position: relative;

            overflow: hidden;

            padding:
                30px
                25px
                50px;

            background:

                radial-gradient(
                    circle at 8% 10%,
                    rgba(244,155,69,.18),
                    transparent 20%
                ),

                radial-gradient(
                    circle at 92% 20%,
                    rgba(76,137,168,.15),
                    transparent 22%
                ),

                var(--paper);

            transition:
                background .4s ease,
                color .4s ease;
        }


        .app.dark {
            --paper: #191817;
            --paper2: #24211e;
            --white: #2b2925;

            --ink: #fff8ef;
            --muted: #aaa096;

            --line: rgba(255,255,255,.09);

            background:

                radial-gradient(
                    circle at 8% 10%,
                    rgba(244,155,69,.10),
                    transparent 20%
                ),

                radial-gradient(
                    circle at 92% 20%,
                    rgba(76,137,168,.10),
                    transparent 22%
                ),

                #191817;
        }


        .grid {
            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: .6;

            background-image:

                linear-gradient(
                    var(--line) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    var(--line) 1px,
                    transparent 1px
                );

            background-size: 28px 28px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black 0%,
                    black 80%,
                    transparent 100%
                );
        }


        .noise {
            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: .035;

            background-image:
                url(
                    "data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
                );
        }


        .container {
            width: min(1100px, 100%);
            margin: auto;

            position: relative;
            z-index: 5;
        }


        /* HEADER */

        .header {
            padding: 10px 0 30px;
        }


        .small-note {
            width: fit-content;

            margin: auto;

            padding:
                7px
                15px;

            font:
                700 13px
                "Kalam",
                cursive;

            letter-spacing: 2px;

            border-bottom:
                2px dashed currentColor;

            transform: rotate(-1deg);
        }


        /* HERO */

        .hero {
            display: grid;

            grid-template-columns:
                150px
                1fr
                150px;

            align-items: center;

            gap: 20px;

            margin-top: 15px;
        }


        .hero-content {
            text-align: center;
        }


        .scribble {
            color: var(--orange);

            font:
                700
                clamp(18px, 3vw, 27px)
                "Kalam",
                cursive;

            transform: rotate(-2deg);

            margin-bottom: 5px;
        }


        .title {
            font:
                400
                clamp(70px, 12vw, 135px)
                /.82
                "Bebas Neue",
                sans-serif;

            letter-spacing: 4px;

            text-shadow:
                6px
                6px
                0
                rgba(244,155,69,.22);
        }


        .section {
            margin-top: 14px;

            color: var(--blue);

            font:
                700
                clamp(20px, 3vw, 31px)
                "Kalam",
                cursive;

            letter-spacing: 5px;
        }


        .underline {
            width: min(350px, 60%);

            height: 10px;

            margin: 3px auto;

            border-bottom:
                4px solid
                var(--orange);

            border-radius: 50%;

            transform: rotate(-1deg);
        }


        /* HERO INFO */

        .hero-info {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-top: 28px;

            font:
                500 11px
                "DM Mono",
                monospace;

            letter-spacing: 1.3px;
        }


        .live {
            display: flex;
            align-items: center;

            gap: 7px;

            padding: 8px 13px;

            border:
                1px solid
                var(--line);

            border-radius: 999px;

            background:
                var(--paper2);
        }


        .live-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #62b96b;

            box-shadow:
                0 0 0 5px
                rgba(98,185,107,.12);
        }


        .theme {
            width: 36px;
            height: 36px;

            border:
                1px solid
                var(--line);

            background:
                var(--paper2);

            color:
                var(--ink);

            border-radius: 50%;

            cursor: pointer;

            font-size: 17px;

            transition: .25s;
        }


        .theme:hover {
            transform:
                rotate(25deg)
                scale(1.1);
        }


        /* CHARACTER */

        .character {
            width: 125px;
            height: 125px;

            position: relative;

            margin: auto;

            filter:
                drop-shadow(
                    7px 9px 0 rgba(0,0,0,.09)
                );
        }


        .character-head {
            position: absolute;

            width: 48px;
            height: 48px;

            left: 38px;
            top: 8px;

            background: #f5c8ad;

            border:
                4px solid
                var(--ink);

            border-radius:
                48% 52% 50% 48%;
        }


        .character-body {
            position: absolute;

            width: 68px;
            height: 53px;

            left: 28px;
            top: 50px;

            background:
                var(--blue);

            border:
                4px solid
                var(--ink);

            border-radius:
                45% 45% 30% 30%;
        }


        .character-leg {
            position: absolute;

            width: 29px;
            height: 37px;

            top: 94px;

            background: #f5f1e8;

            border:
                4px solid
                var(--ink);

            border-radius:
                0 0 45% 45%;
        }


        .leg1 {
            left: 30px;
            transform: rotate(8deg);
        }


        .leg2 {
            right: 29px;
            transform: rotate(-8deg);
        }


        .character.left {
            transform: rotate(-7deg);
        }


        .character.right {
            transform: rotate(7deg);
        }


        .mini-ball {
            position: absolute;

            width: 35px;
            height: 35px;

            right: -8px;
            top: 0;

            border:
                4px solid
                var(--ink);

            border-radius: 50%;

            background:

                repeating-linear-gradient(
                    60deg,
                    var(--orange) 0 8px,
                    #fff0d8 8px 16px
                );
        }


        /* DAYS */

        .days {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 12px;

            margin-bottom: 30px;
        }


        .day {
            position: relative;

            border:
                2px solid
                transparent;

            background:
                var(--paper2);

            color:
                var(--ink);

            padding:
                14px
                10px;

            border-radius: 15px;

            cursor: pointer;

            box-shadow:
                0
                7px
                0
                rgba(0,0,0,.06);

            font:
                700 17px
                "Kalam",
                cursive;

            transition: .25s;
        }


        .day:nth-child(odd) {
            transform: rotate(-1deg);
        }


        .day:nth-child(even) {
            transform: rotate(.8deg);
        }


        .day:hover {
            transform:
                translateY(-5px)
                rotate(0deg);
        }


        .day.active {
            background: var(--white);

            border-color:
                var(--orange);

            box-shadow:
                0
                8px
                0
                rgba(244,155,69,.22);
        }


        .day-number {
            display: block;

            font:
                500 9px
                "DM Mono",
                monospace;

            opacity: .45;

            margin-bottom: 2px;
        }


        .today-label {
            position: absolute;

            top: -9px;
            right: 8px;

            background:
                var(--red);

            color: white;

            border-radius: 999px;

            padding:
                3px
                8px;

            font:
                500 8px
                "DM Mono",
                monospace;
        }


        /* BOARD */

        .board {
            position: relative;

            padding: 38px;

            background:
                var(--paper2);

            border:
                1px solid
                rgba(0,0,0,.07);

            border-radius: 8px;

            box-shadow:
                var(--shadow);

            transform: rotate(-.3deg);
        }


        .board::before {
            content: "";

            position: absolute;

            inset: 9px;

            z-index: -1;

            background:
                var(--white);

            border:
                1px solid
                var(--line);

            border-radius: 8px;

            transform: rotate(1deg);
        }


        .board::after {
            content: "";

            position: absolute;

            left: 15px;
            right: -7px;
            bottom: -7px;

            height: 100%;

            z-index: -2;

            background:
                #f1d398;

            border-radius: 8px;

            transform: rotate(-1deg);
        }


        /* TAPE */

        .tape {
            position: absolute;

            top: -13px;

            width: 125px;
            height: 32px;

            background:
                rgba(247,213,157,.7);

            z-index: 10;
        }


        .tape.left {
            left: 12%;
            transform: rotate(-5deg);
        }


        .tape.right {
            right: 12%;
            transform: rotate(6deg);
        }


        /* BOARD HEADER */

        .board-header {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            padding-bottom: 18px;

            margin-bottom: 24px;

            border-bottom:
                2px dashed
                var(--line);
        }


        .eyebrow {
            font:
                500 10px
                "DM Mono",
                monospace;

            letter-spacing: 2px;

            color:
                var(--muted);
        }


        .day-title {
            margin-top: 3px;

            font:
                700
                clamp(40px, 6vw, 62px)
                "Kalam",
                cursive;

            line-height: 1;
        }


        .sticker {
            padding:
                10px
                14px;

            background:
                var(--yellow);

            color: #171717;

            font:
                700 12px
                "Kalam",
                cursive;

            box-shadow:
                4px
                5px
                0
                rgba(0,0,0,.1);

            transform: rotate(4deg);
        }


        /* TIMELINE */

        .timeline {
            display: grid;
            gap: 14px;
        }


        /* CLASS CARD */

        .class-card {
            position: relative;

            display: grid;

            grid-template-columns:
                160px
                1fr
                35px;

            min-height: 100px;

            align-items: center;

            gap: 18px;

            background:
                var(--white);

            border:
                1px solid
                var(--line);

            border-radius: 6px;

            padding:
                15px
                20px
                15px
                0;

            box-shadow:
                5px
                6px
                0
                rgba(0,0,0,.055);

            transition: .22s;

            overflow: hidden;
        }


        .class-card:hover {
            transform:
                translateX(7px)
                rotate(.25deg);

            box-shadow:
                9px
                10px
                0
                rgba(0,0,0,.08);
        }


        /* TIME */

        .time {
            align-self: stretch;

            display: flex;

            flex-direction: column;

            justify-content: center;

            padding-left: 23px;

            border-right:
                2px dashed
                var(--line);

            font:
                700 14px
                "DM Mono",
                monospace;
        }


        .time-end {
            color:
                var(--muted);

            margin-top: 5px;

            font-size: 11px;
        }


        /* PIN */

        .pin {
            position: absolute;

            width: 13px;
            height: 13px;

            left: 153px;
            top: 12px;

            border-radius: 50%;

            box-shadow:
                0
                2px
                0
                rgba(0,0,0,.15);
        }


        .orange {
            background:
                var(--orange);
        }


        .blue {
            background:
                var(--blue);
        }


        .red {
            background:
                var(--red);
        }


        .teal {
            background:
                var(--teal);
        }


        .purple {
            background:
                var(--purple);
        }


        /* TYPE */

        .type {
            display: inline-block;

            padding:
                4px
                7px;

            margin-bottom: 7px;

            border-radius: 4px;

            background:
                #e8eef0;

            color:
                #356071;

            font:
                500 9px
                "DM Mono",
                monospace;

            letter-spacing: 1.4px;
        }


        .type.lab {
            background:
                #f8dfb8;

            color:
                #8a5a19;
        }


        /* SUBJECT */

        .subject {
            font:
                700
                clamp(19px, 3vw, 29px)
                /1.05
                "Kalam",
                cursive;
        }


        /* ARROW */

        .arrow {
            font-size: 28px;

            opacity: .3;

            transform:
                rotate(-8deg);
        }


        /* LAB GRID */

        .lab-grid {
            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 18px;
        }


        .lab-item {
            padding-left: 12px;

            border-left:
                3px solid
                var(--orange);
        }


        .lab-item:nth-child(2) {
            border-left-color:
                var(--blue);
        }


        .lab-label {
            font:
                700 8px
                "DM Mono",
                monospace;

            color:
                var(--muted);

            letter-spacing: 1px;
        }


        .lab-item .subject {
            font-size:
                clamp(16px, 2.5vw, 24px);
        }


        /* LUNCH */

        .lunch {
            min-height: 60px;

            opacity: .75;

            background:

                repeating-linear-gradient(
                    -3deg,
                    #f2ede5,
                    #f2ede5 12px,
                    #eee7dc 12px,
                    #eee7dc 24px
                );
        }


        .lunch .time {
            border: none;
        }


        .lunch .subject {
            color:
                var(--muted);

            font-size: 21px;
        }


        /* FOOTER */

        .board-footer {
            display: flex;

            justify-content:
                space-between;

            margin-top: 23px;

            padding-top: 15px;

            border-top:
                2px dashed
                var(--line);

            color:
                var(--muted);

            font:
                500 10px
                "DM Mono",
                monospace;

            letter-spacing: 1px;

            text-transform: uppercase;
        }


        .footer {
            display: flex;

            justify-content:
                space-between;

            color:
                var(--muted);

            font:
                500 9px
                "DM Mono",
                monospace;

            letter-spacing: 1.5px;

            padding:
                28px
                3px
                0;
        }


        /* DOODLES */

        .doodle {
            position: fixed;

            z-index: 2;

            pointer-events: none;
        }


        .paw {
            font-size: 55px;
            opacity: .85;
        }


        .paw1 {
            left: 2%;
            top: 7%;

            transform:
                rotate(-20deg);
        }


        .paw2 {
            right: 3%;
            top: 43%;

            transform:
                rotate(20deg);
        }


        .paw3 {
            left: 6%;
            bottom: 4%;

            transform:
                rotate(-12deg);
        }


        /* BALL */

        .ball {
            width: 60px;
            height: 60px;

            border:
                5px solid
                var(--ink);

            border-radius: 50%;

            background:

                repeating-linear-gradient(
                    55deg,
                    var(--orange) 0 10px,
                    #f8f0e2 10px 20px
                );

            box-shadow:
                5px
                7px
                0
                rgba(0,0,0,.08);
        }


        .ball1 {
            left: 3%;
            top: 28%;

            transform:
                rotate(25deg);
        }


        .ball2 {
            right: 3%;
            top: 72%;

            transform:
                rotate(-30deg);
        }


        .ball3 {
            right: 20%;
            bottom: 4%;

            transform:
                rotate(45deg)
                scale(.75);
        }


        /* RESPONSIVE */

        @media(max-width:800px) {

            .app {
                padding:
                    20px
                    13px
                    40px;
            }


            .hero {
                grid-template-columns: 1fr;
            }


            .character {
                display: none;
            }


            .days {
                grid-template-columns:
                    repeat(2,1fr);
            }


            .board {
                padding:
                    25px
                    15px;
            }


            .class-card {
                grid-template-columns:
                    110px
                    1fr;

                gap: 12px;
            }


            .arrow {
                display: none;
            }


            .pin {
                left: 103px;
            }


            .lab-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }


            .doodle {
                display: none;
            }
        }


        @media(max-width:480px) {

            .title {
                font-size: 58px;
            }


            .section {
                font-size: 21px;
            }


            .days {
                grid-template-columns:
                    1fr 1fr;
            }


            .day {
                font-size: 14px;
            }


            .board-header {
                align-items: flex-start;
            }


            .sticker {
                font-size: 9px;
                padding: 8px;
            }


            .class-card {
                grid-template-columns: 1fr;
                padding: 15px;
            }


            .time {
                border-right: none;

                border-bottom:
                    2px dashed
                    var(--line);

                padding:
                    0
                    0
                    10px;
            }


            .pin {
                display: none;
            }


            .subject {
                font-size: 21px;
            }


            .footer {
                flex-wrap: wrap;
                gap: 10px;
            }
        }

    </style>

</head>

            },

            {
                time: "11:00 – 11:55",
                subject:
                    "Signals and Systems",
                type: "Lecture"
            },

            {
                time: "12:00 – 12:55",
                subject:
                    "Mathematics III",
                type: "Lecture"
            },

            {
                time: "13:00 – 13:55",
                subject:
                    "Lunch",
                type: "Lunch",
                break: true
            },

            {
                time: "14:00 – 16:00",
                subject:
                    "Signals and Systems Lab / Object Oriented Programming Lab",
                type: "Lab",
                split: true
            }

        ]

    };


    /* =====================================================
       APP
    ====================================================== */

    function App() {

        const [activeDay, setActiveDay] =
            React.useState("Monday");

        const [dark, setDark] =
            React.useState(false);

        const [now, setNow] =
            React.useState(new Date());


        React.useEffect(() => {

            const timer =
                setInterval(() => {

                    setNow(new Date());

                }, 1000);


            return () =>
                clearInterval(timer);

        }, []);


        const today =
            new Intl.DateTimeFormat(
                "en-US",
                {
                    weekday: "long"
                }
            ).format(now);


        const currentTime =
            new Intl.DateTimeFormat(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true
                }
            ).format(now);


        const currentSchedule =
            schedule[activeDay];


        const classCount =
            currentSchedule.filter(
                item => !item.break
            ).length;


        return (

            <main
                className={
                    dark
                        ? "app dark"
                        : "app"
                }
            >

                <div className="grid"></div>

                <div className="noise"></div>


                <div className="doodle paw paw1">
                    ✿
                </div>

                <div className="doodle paw paw2">
                    ✿
                </div>

                <div className="doodle paw paw3">
                    ✿
                </div>


                <div className="doodle ball ball1"></div>

                <div className="doodle ball ball2"></div>

                <div className="doodle ball ball3"></div>


                <div className="container">


                    <header className="header">

                        <div className="small-note">
                            IIIT SENAPATI • MANIPUR
                        </div>


                        <div className="hero">


                            <div className="character left">

                                <div className="character-head"></div>

                                <div className="character-body"></div>

                                <div className="character-leg leg1"></div>

                                <div className="character-leg leg2"></div>

                            </div>


                            <div className="hero-content">

                                <div className="scribble">
                                    class schedule
                                </div>


                                <h1 className="title">
                                    III SEMESTER
                                </h1>


                                <div className="section">
                                    SECTION A
                                </div>


                                <div className="underline"></div>

                            </div>


                            <div className="character right">

                                <div className="character-head"></div>

                                <div className="character-body"></div>

                                <div className="character-leg leg1"></div>

                                <div className="character-leg leg2"></div>

                                <div className="mini-ball"></div>

                            </div>

                        </div>


                        <div className="hero-info">

                            <span>
                                JULY — NOVEMBER 2026
                            </span>


                            <span className="live">

                                <span className="live-dot"></span>

                                {currentTime}

                            </span>


                            <button
                                className="theme"
                                onClick={() =>
                                    setDark(
                                        value => !value
                                    )
                                }
                            >
                                {dark ? "☀" : "☾"}
                            </button>

                        </div>

                    </header>


                    <section className="days">

                        {DAYS.map(
                            (day, index) => {

                                const isToday =
                                    day === today;


                                return (

                                    <button
                                        key={day}
                                        className={
                                            activeDay === day
                                                ? "day active"
                                                : "day"
                                        }
                                        onClick={() =>
                                            setActiveDay(day)
                                        }
                                    >

                                        <span className="day-number">
                                            0{index + 1}
                                        </span>


                                        {day}


                                        {isToday && (

                                            <span className="today-label">
                                                TODAY
                                            </span>

                                        )}

                                    </button>

                                );

                            }
                        )}

                    </section>


                    <section className="board">

                        <div className="tape left"></div>

                        <div className="tape right"></div>


                        <div className="board-header">

                            <div>

                                <span className="eyebrow">
                                    YOUR DAY
                                </span>


                                <h2 className="day-title">
                                    {activeDay}
                                </h2>

                            </div>


                            <div className="sticker">
                                SECTION A ✦
                            </div>

                        </div>


                        <div className="timeline">

                            {currentSchedule.map(
                                (item, index) => {

                                    const colors = [
                                        "orange",
                                        "blue",
                                        "red",
                                        "teal",
                                        "purple"
                                    ];


                                    const color =
                                        colors[
                                            index %
                                            colors.length
                                        ];


                                    if (item.break) {

                                        return (

                                            <article
                                                key={item.time}
                                                className="
                                                    class-card
                                                    lunch
                                                "
                                            >

                                                <div className="time">

                                                    <span>
                                                        {
                                                            item.time.split(
                                                                " – "
                                                            )[0]
                                                        }
                                                    </span>


                                                    <span className="time-end">
                                                        {
                                                            item.time.split(
                                                                " – "
                                                            )[1]
                                                        }
                                                    </span>

                                                </div>


                                                <div>

                                                    <span className="type">
                                                        BREAK
                                                    </span>


                                                    <div className="subject">
                                                        🍱 Lunch
                                                    </div>

                                                </div>

                                            </article>

                                        );

                                    }


                                    return (

                                        <article
                                            key={item.time}
                                            className="class-card"
                                        >


                                            <div className="time">

                                                <span>
                                                    {
                                                        item.time.split(
                                                            " – "
                                                        )[0]
                                                    }
                                                </span>


                                                <span className="time-end">
                                                    {
                                                        item.time.split(
                                                            " – "
                                                        )[1]
                                                    }
                                                </span>

                                            </div>


                                            <div
                                                className={
                                                    `pin ${color}`
                                                }
                                            ></div>


                                            <div>

                                                <span
                                                    className={
                                                        item.type === "Lab"
                                                            ? "type lab"
                                                            : "type"
                                                    }
                                                >
                                                    {item.type}
                                                </span>


                                                {!item.split && (

                                                    <div className="subject">
                                                        {item.subject}
                                                    </div>

                                                )}


                                                {item.split && (

                                                    <div className="lab-grid">

                                                        {item.subject
                                                            .split(" / ")
                                                            .map(
                                                                (
                                                                    subject,
                                                                    i
                                                                ) => (

                                                                    <div
                                                                        className="lab-item"
                                                                        key={subject}
                                                                    >

                                                                        <div className="lab-label">
                                                                            {
                                                                                i === 0
                                                                                    ? "A1"
                                                                                    : "A2"
                                                                            }
                                                                        </div>


                                                                        <div className="subject">
                                                                            {subject}
                                                                        </div>

                                                                    </div>

                                                                )
                                                            )}

                                                    </div>

                                                )}

                                            </div>


                                            <div className="arrow">
                                                ↗
                                            </div>

                                        </article>

                                    );

                                }
                            )}

                        </div>


                        <div className="board-footer">

                            <span>
                                ✦ show up • learn • repeat
                            </span>


                            <span>
                                {classCount} CLASSES
                            </span>

                        </div>

                    </section>


                    <footer className="footer">

                        <span>
                            III SEM • SECTION A
                        </span>


                        <span>
                            MONDAY — FRIDAY
                        </span>


                        <span>
                            2026
                        </span>

                    </footer>

                </div>

            </main>

        );

    }


    ReactDOM
        .createRoot(
            document.getElementById("root")
        )
        .render(
            <App />
        );

</script>

</body>

</html>
